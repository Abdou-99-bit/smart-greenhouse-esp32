
<html>
<head>
    <title>Smart GreenHouse Panel</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #e8f5e9; margin: 40px; }
        .container { background: white; padding: 30px; max-width: 400px; margin: auto; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
        h1 { color: #2e7d32; border-bottom: 2px solid #81c784; padding-bottom: 10px; }
        .metric { font-size: 1.2em; margin: 15px 0; text-align: left; padding-left: 20px; }
        .status { font-weight: bold; color: #1b5e20; }
        .alert { color: #d32f2f; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Greenhouse Dashboard</h1>
        <div class="metric">🌡️ <b>Temperature:</b> 25.0 °C</div>
        <div class="metric">💧 <b>Soil Moisture:</b> 68.5%</div>
        <div class="metric">⚙️ <b>Water Pump:</b> <span class="status">IDLE (OFF)</span></div>
        <div class="metric">🌀 <b>Extractor Fan:</b> <span class="status">IDLE (OFF)</span></div>
        <hr>
        <p style="color: #555; font-size: 0.9em;">System Status: Local Web Server Hosting Active on Port 80</p>
    </div>
</body>
</html>
